<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='monospace' font-size='12' fill='%23fff'%3EIQ%3C/text%3E%3C/svg%3E"
  />
  <title>IQ Analyzer · Lambda Crypto Platform</title>
  <meta
    name="description"
    content="Dashboard de mercado en vivo y consola conversacional Qwen2.5 sobre arquitectura Lambda."
  />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">IQ ANALYZER</span>
        <span class="brand-sub">lambda-crypto-platform</span>
      </div>

      <div class="controls">
        <label class="control">
          <span>Activo</span>
          <select id="symbolSelect" aria-label="Seleccionar activo"></select>
        </label>
        <label class="control">
          <span>Exchange</span>
          <select id="exchangeSelect" aria-label="Seleccionar exchange">
            <option value="binance">Binance WebSocket</option>
            <option value="coingecko">CoinGecko API</option>
          </select>
        </label>
        <div class="timeframes" id="timeframes" role="group" aria-label="Intervalo de velas"></div>
      </div>

      <div class="stream-state">
        <span id="streamBadge" class="badge badge-ok">● STREAMING ACTIVO</span>
        <span id="lastUpdated" class="muted">Última actualización: --:--:-- UTC</span>
      </div>
    </header>

    <section class="kpis" id="kpis" aria-label="Métricas de mercado"></section>

    <main class="workspace">
      <section class="chart-card" aria-label="Gráfico de velas OHLCV">
        <div class="chart-head">
          <div class="chart-title">
            <span id="chartSymbol">BTCUSDT</span>
            <span id="chartInterval" class="pill">15m</span>
            <span id="chartSource" class="muted">OHLCV · Binance WebSocket</span>
          </div>
          <div class="chart-meta">
            <span id="freshness">Frescura --</span>
            <span id="chartStatus">Esperando feed…</span>
          </div>
        </div>
        <div class="chart-wrap" id="chartWrap">
          <canvas id="chartCanvas"></canvas>
          <div id="chartTooltip" class="chart-tooltip hidden"></div>
          <div id="chartEmpty" class="chart-empty">Cargando mercado…</div>
        </div>
      </section>
    </main>

    <section class="pipeline-card" id="pipelineCard" aria-label="Salud del pipeline">
      <button
        id="pipelineToggle"
        class="pipeline-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="pipelineRows"
      >
        <span class="pipeline-title">
          Pipeline Health
          <span id="pipelineBadge" class="badge badge-ok">● OPERATIVO</span>
        </span>
        <span class="pipeline-meta">
          <span id="pipelineFreshness">Frescura --</span>
          <span class="chevron">⌄</span>
        </span>
      </button>
      <div id="pipelineRows" class="pipeline-rows" hidden></div>
    </section>
  </div>

  <button id="chatOpen" class="chat-fab" type="button">✦ Preguntar a Qwen</button>

  <aside id="chatPanel" class="chat-panel" aria-hidden="true" aria-label="Consola conversacional">
    <header class="chat-header">
      <div>
        <strong>IQ Analyzer AI</strong>
        <span class="muted">Qwen2.5 · RAG · guardrails SQL</span>
      </div>
      <button id="chatClose" class="icon-btn" type="button" aria-label="Cerrar chat">×</button>
    </header>

    <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
    <div id="chatQuick" class="chat-quick" aria-label="Preguntas rápidas"></div>

    <form id="chatForm" class="chat-form">
      <textarea
        id="chatInput"
        rows="1"
        maxlength="4000"
        placeholder="Pregunta lo que sea..."
        aria-label="Pregunta para el asistente"
      ></textarea>
      <button id="chatSend" type="submit" aria-label="Enviar pregunta">→</button>
    </form>

    <div class="chat-foot">
      <span>Información referencial · no es asesoría financiera</span>
      <span id="chatStatus" class="muted">Listo</span>
    </div>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
