services:
  # ----------------------------------------------------------------------------
  # 1. MinIO: Data Lake de Almacenamiento Duradero (OrganizaciÃ³n Funcional)
  # ----------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: lambda-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lambda-net

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: lambda-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword123}
      SPARK_MINIO_USER: ${SPARK_MINIO_USER:-spark_service}
      SPARK_MINIO_PASSWORD: ${SPARK_MINIO_PASSWORD:-spark_secure_lake_pass123}
      AIRFLOW_MINIO_USER: ${AIRFLOW_MINIO_USER:-airflow_service}
      AIRFLOW_MINIO_PASSWORD: ${AIRFLOW_MINIO_PASSWORD:-airflow_secure_lake_pass123}
      API_MINIO_USER: ${API_MINIO_USER:-api_service}
      API_MINIO_PASSWORD: ${API_MINIO_PASSWORD:-api_secure_serving_pass123}
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh:ro
      - ./minio/policies:/policies:ro
    entrypoint: ["/usr/bin/bash", "/init-buckets.sh"]
    networks:
      - lambda-net

  # ----------------------------------------------------------------------------
  # 2. Apache Kafka: Bus de Eventos en tiempo real (KRaft Mode)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: lambda-kafka
    restart: unless-stopped
    user: root
    ports:
      - "${KAFKA_INTERNAL_PORT:-9092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L622nShT-2xMVuLqW6q3w}
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
      - ./kafka/check-consumer-lag.sh:/check-consumer-lag.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 6
    networks:
      - lambda-net

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: lambda-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER_LIST: kafka:9092
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    networks:
      - lambda-net

  # ----------------------------------------------------------------------------
  # 3. PostgreSQL: Base de datos para Airflow y Serving Layer
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: lambda-postgres
    restart: unless-stopped
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=256MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-market_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-market_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lambda-net

  # ----------------------------------------------------------------------------
  # 4. Apache Spark: Master y Worker (Batch & Speed Layers)
  # ----------------------------------------------------------------------------
  spark-master:
    image: bitnamilegacy/spark:3.5.1
    container_name: lambda-spark-master
    restart: unless-stopped
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - AWS_ACCESS_KEY_ID=${SPARK_MINIO_USER:-spark_service}
      - AWS_SECRET_ACCESS_KEY=${SPARK_MINIO_PASSWORD:-spark_secure_lake_pass123}
      - AWS_REGION=us-east-1
      - S3_ENDPOINT=http://minio:9000
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_MASTER_WEBUI_PORT:-8080}:8080"
    volumes:
      - ../spark:/opt/bitnami/spark/jobs:ro
      - spark_data:/bitnami/spark
    healthcheck:
      test: ["CMD", "/opt/bitnami/python/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lambda-net

  spark-worker:
    image: bitnamilegacy/spark:3.5.1
    container_name: lambda-spark-worker
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-1G}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - AWS_ACCESS_KEY_ID=${SPARK_MINIO_USER:-spark_service}
      - AWS_SECRET_ACCESS_KEY=${SPARK_MINIO_PASSWORD:-spark_secure_lake_pass123}
      - AWS_REGION=us-east-1
      - S3_ENDPOINT=http://minio:9000
    ports:
      - "${SPARK_WORKER_WEBUI_PORT:-8081}:8081"
    volumes:
      - ../spark:/opt/bitnami/spark/jobs:ro
    networks:
      - lambda-net

  # Job de Spark Structured Streaming de larga duración (Speed Layer, US-18/19).
  # Sin este servicio, `streaming_market.py` solo corre si alguien lo lanza a
  # mano por terminal: `serving.realtime_metrics` nunca se actualiza y la API
  # cae siempre al dato sintético de `api/market_data.py`.
  spark-streaming:
    image: bitnamilegacy/spark:3.5.1
    container_name: lambda-spark-streaming
    restart: unless-stopped
    # La imagen bitnami corre por defecto con el UID 1001, que no tiene
    # entrada en /etc/passwd. Hadoop (usado por `--packages` y S3A) necesita
    # resolver el usuario del sistema operativo incluso en modo simple y
    # revienta con `LoginException: invalid null input: name` si no existe
    # esa entrada. Root sí la tiene.
    user: "0:0"
    depends_on:
      spark-master:
        condition: service_healthy
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - SERVING_DB_NAME=serving_db
      - SERVING_DB_USER=${POSTGRES_USER:-postgres}
      - SERVING_DB_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_pass}
      - AWS_ACCESS_KEY_ID=${SPARK_MINIO_USER:-spark_service}
      - AWS_SECRET_ACCESS_KEY=${SPARK_MINIO_PASSWORD:-spark_secure_lake_pass123}
      - AWS_REGION=us-east-1
      - S3_ENDPOINT=http://minio:9000
      - HOME=/tmp/spark-home
      - HADOOP_USER_NAME=spark
      - USER=spark
    volumes:
      - ../spark:/opt/bitnami/spark/jobs:ro
    # La imagen bitnami/spark no trae psycopg2 (lo usa el sink de
    # `serving.realtime_metrics`); se instala al arrancar para no mantener
    # una imagen custom solo por esta dependencia. `HOME` se fija porque la
    # imagen no lo define y Spark resuelve `~/.ivy2` a una ruta inválida
    # ("basedir must be absolute") al resolver --packages sin él.
    entrypoint:
      - /bin/bash
      - -c
      - |
        mkdir -p "$$HOME" && \
        pip install --no-cache-dir psycopg2-binary==2.9.9 && \
        exec /opt/bitnami/spark/bin/spark-submit \
          --master spark://spark-master:7077 \
          --executor-memory 512m \
          --executor-cores 1 \
          --total-executor-cores 1 \
          --conf spark.jars.ivy=/tmp/spark-home/.ivy2 \
          --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3 \
          /opt/bitnami/spark/jobs/streaming_market.py \
          --bootstrap-servers kafka:9092
    networks:
      - lambda-net

  # Productor REST continuo: Binance bloquea el WebSocket con HTTP 451 en
  # algunas regiones, pero el espejo `data-api.binance.vision` responde.
  market-producer:
    build:
      context: ..
      dockerfile: infra/ingestion/Dockerfile
    container_name: lambda-market-producer
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - BINANCE_API_BASE=${BINANCE_API_BASE:-https://data-api.binance.vision}
    command:
      - python
      - -m
      - ingestion.connectors.market_rest_stream
      - --symbols
      - BTCUSDT,ETHUSDT,SOLUSDT
      - --bootstrap
      - kafka:9092
      - --poll-interval
      - "2"
    networks:
      - lambda-net

  # ----------------------------------------------------------------------------
  # 5. Apache Airflow: Orquestador Batch
  # ----------------------------------------------------------------------------
  airflow-init:
    build:
      context: ./airflow
    container_name: lambda-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    entrypoint:
      - /bin/bash
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_USER:-admin}" \
          --password "${AIRFLOW_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "${AIRFLOW_EMAIL:-andres@local.dev}" || true
    networks:
      - lambda-net

  airflow:
    build:
      context: ./airflow
    container_name: lambda-airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AWS_ACCESS_KEY_ID: ${AIRFLOW_MINIO_USER:-airflow_service}
      AWS_SECRET_ACCESS_KEY: ${AIRFLOW_MINIO_PASSWORD:-airflow_secure_lake_pass123}
      AIRFLOW_CONN_MINIO_DEFAULT: aws://${AIRFLOW_MINIO_USER:-airflow_service}:${AIRFLOW_MINIO_PASSWORD:-airflow_secure_lake_pass123}@?endpoint_url=http%3A%2F%2Fminio%3A9000
      # La reconciliación corre junto al streaming: 512m/1 core por executor
      # permite que ambos entren en el worker de 1G/2 cores.
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-512m}
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-512m}
      SPARK_EXECUTOR_CORES: ${SPARK_EXECUTOR_CORES:-1}
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8085}:8080"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../spark:/opt/airflow/spark:ro
      - ../ingestion:/opt/airflow/ingestion:ro
      - airflow_logs:/opt/airflow/logs
    command: standalone
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - lambda-net

  # ----------------------------------------------------------------------------
  # 6. Serving Layer: FastAPI Backend y Servidor Frontend
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: lambda-serving-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-market_platform}
      # `query_service.py` prioriza SERVING_DB_NAME sobre POSTGRES_DB; sin esto
      # la API lee la réplica de compatibilidad en `market_platform` en vez de
      # `serving_db`, que es donde escriben streaming_market.py/serving_reconcile.py.
      SERVING_DB_NAME: ${SERVING_DB_NAME:-serving_db}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${API_MINIO_USER:-api_service}
      MINIO_SECRET_KEY: ${API_MINIO_PASSWORD:-api_secure_serving_pass123}
      BINANCE_API_BASE: ${BINANCE_API_BASE:-https://data-api.binance.vision}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-60}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-bge-m3}
      SEMANTIC_ROUTER_ENABLED: ${SEMANTIC_ROUTER_ENABLED:-true}
      SEMANTIC_ROUTER_THRESHOLD: ${SEMANTIC_ROUTER_THRESHOLD:-0.72}
      SEMANTIC_ROUTER_CACHE_PATH: ${SEMANTIC_ROUTER_CACHE_PATH:-/app/metadata/router_embeddings.json}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GROQ_TIMEOUT_SECONDS: ${GROQ_TIMEOUT_SECONDS:-30}
      FRONTEND_DIR: /app/static
      STATIC_DIR: /app/static
      RAG_INDEX_PATH: /app/metadata/rag_index.json
      RAG_DOCS_DIR: /app/metadata
      CATALOG_PATH: /app/metadata/catalog.json
      GLOSSARY_PATH: /app/metadata/glossary.json
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../api:/app/api
      - ../metadata:/app/metadata
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lambda-net

  # ----------------------------------------------------------------------------
  # 7. Ollama: Inferencia Local de Qwen2.5 (Perfil opcional 'llm')
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: lambda-ollama
    restart: unless-stopped
    profiles:
      - llm
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - lambda-net

  # Descarga idempotente del modelo Qwen2.5 al levantar el perfil llm.
  ollama-init:
    image: ollama/ollama:latest
    container_name: lambda-ollama-init
    profiles:
      - llm
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - "ollama pull ${OLLAMA_MODEL:-qwen2.5:3b-instruct} && ollama pull ${OLLAMA_EMBEDDING_MODEL:-bge-m3}"
    restart: "no"
    networks:
      - lambda-net

  # ----------------------------------------------------------------------------
  # 8. OpenMetadata & OpenSearch: CatÃ¡logo de Datos, Linaje y Calidad (Perfil 'metadata')
  # ----------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: lambda-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    profiles:
      - metadata
    networks:
      - lambda-net

  openmetadata-server:
    image: docker.getcollate.io/openmetadata/server:1.4.1
    container_name: lambda-openmetadata-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      - DB_DRIVER_CLASS=org.postgresql.Driver
      - DB_SCHEME=postgresql
      - DB_USE_SSL=false
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_USER_PASSWORD=${POSTGRES_PASSWORD:-postgres_secure_pass}
      - DB_HOST=postgres
      - DB_PORT=${POSTGRES_PORT:-5432}
      - DB_DATABASE=openmetadata_db
      - SEARCH_TYPE=opensearch
      - SEARCH_HOST=opensearch
      - SEARCH_PORT=9200
      - SEARCH_SCHEME=http
      - OPENMETADATA_SERVER_HOST=0.0.0.0
      - OPENMETADATA_SERVER_PORT=8585
    ports:
      - "${OPENMETADATA_PORT:-8585}:8585"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8585/api/v1/system/version"]
      interval: 15s
      timeout: 10s
      retries: 8
    profiles:
      - metadata
    networks:
      - lambda-net

networks:
  lambda-net:
    name: lambda-platform-network
    driver: bridge

volumes:
  minio_data:
  kafka_data:
  postgres_data:
  spark_data:
  airflow_logs:
  ollama_data:
  opensearch_data:
