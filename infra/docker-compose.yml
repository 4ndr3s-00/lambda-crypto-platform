services:
  # ----------------------------------------------------------------------------
  # 1. MinIO: Data Lake de Almacenamiento Duradero (Organización Funcional)
  # ----------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: lambda-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/9000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lambda-net

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: lambda-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword123}
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/usr/bin/bash", "/init-buckets.sh"]
    networks:
      - lambda-net

  # ----------------------------------------------------------------------------
  # 2. Apache Kafka: Bus de Eventos en tiempo real (KRaft Mode)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: lambda-kafka
    restart: unless-stopped
    user: root
    ports:
      - "${KAFKA_INTERNAL_PORT:-9092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L622nShT-2xMVuLqW6q3w}
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 6
    networks:
      - lambda-net

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: lambda-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER_LIST: kafka:9092
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    networks:
      - lambda-net

  # ----------------------------------------------------------------------------
  # 3. PostgreSQL: Base de datos para Airflow y Serving Layer
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: lambda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-market_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-market_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lambda-net

  # ----------------------------------------------------------------------------
  # 4. Apache Spark: Master y Worker (Batch & Speed Layers)
  # ----------------------------------------------------------------------------
  spark-master:
    image: bitnamilegacy/spark:3.5.1
    container_name: lambda-spark-master
    restart: unless-stopped
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_MASTER_WEBUI_PORT:-8080}:8080"
    volumes:
      - ../spark:/opt/bitnami/spark/jobs:ro
      - spark_data:/bitnami/spark
    healthcheck:
      test: ["CMD", "/opt/bitnami/python/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lambda-net

  spark-worker:
    image: bitnamilegacy/spark:3.5.1
    container_name: lambda-spark-worker
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY:-1G}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES:-2}
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "${SPARK_WORKER_WEBUI_PORT:-8081}:8081"
    volumes:
      - ../spark:/opt/bitnami/spark/jobs:ro
    networks:
      - lambda-net

  # ----------------------------------------------------------------------------
  # 5. Apache Airflow: Orquestador Batch
  # ----------------------------------------------------------------------------
  airflow-init:
    build:
      context: ./airflow
    container_name: lambda-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    entrypoint:
      - /bin/bash
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_USER:-admin}" \
          --password "${AIRFLOW_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "${AIRFLOW_EMAIL:-andres@local.dev}" || true
    networks:
      - lambda-net

  airflow:
    build:
      context: ./airflow
    container_name: lambda-airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-miniopassword123}
      AIRFLOW_CONN_MINIO_DEFAULT: aws://minioadmin:miniopassword123@?endpoint_url=http%3A%2F%2Fminio%3A9000
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8085}:8080"
    volumes:
      - ../dags:/opt/airflow/dags
      - ../spark:/opt/airflow/spark:ro
      - ../ingestion:/opt/airflow/ingestion:ro
      - airflow_logs:/opt/airflow/logs
    command: standalone
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - lambda-net

  # ----------------------------------------------------------------------------
  # 6. Serving Layer: FastAPI Backend y Servidor Frontend
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ../api
    container_name: lambda-serving-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-market_platform}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-miniopassword123}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../api:/app
      - ../frontend:/app/static:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lambda-net

  # ----------------------------------------------------------------------------
  # 7. Ollama: Inferencia Local de Qwen2.5 (Perfil opcional 'llm')
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: lambda-ollama
    restart: unless-stopped
    profiles:
      - llm
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - lambda-net

networks:
  lambda-net:
    name: lambda-platform-network
    driver: bridge

volumes:
  minio_data:
  kafka_data:
  postgres_data:
  spark_data:
  airflow_logs:
  ollama_data:
