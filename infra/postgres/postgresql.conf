# ==============================================================================
# CONFIGURACIÓN Y AFINAMIENTO DE POSTGRESQL 16 (US-04)
# Responsable: Samuel Roncancio (Storage & Database Lead)
# ==============================================================================

# 1. Conexiones y Pooling
max_connections = 100
superuser_reserved_connections = 3

# 2. Memoria y Buffers
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 32MB
effective_cache_size = 256MB

# 3. Checkpoints y WAL (Write-Ahead Logging)
wal_buffers = 4MB
min_wal_size = 80MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9

# 4. Planificador de Consultas (SSD / NVMe / I/O Concurrente)
random_page_cost = 1.1
effective_io_concurrency = 200

# 5. Localización y Logging
log_timezone = 'UTC'
datestyle = 'iso, ymd'
timezone = 'UTC'
