# ==============================================================================
# Override de Docker Compose para Apache Atlas (Gobierno y Linaje - US-27)
# ==============================================================================
# Este archivo es un complemento opt-in: no se ejecuta en el `make up` básico
# para mantener bajo el consumo de memoria en entornos locales estándar.
#
# Para levantar la plataforma incluyendo la consola de gobierno de Apache Atlas:
#
#     docker compose -p lambda-crypto-platform \
#                    -f infra/docker-compose.yml \
#                    -f infra/docker-compose.atlas.yml \
#                    --env-file .env up -d atlas
#
# Puertos expuestos:
#     - 21000: Consola Web y REST API v2 de Apache Atlas (admin / admin)
# ==============================================================================
services:
  atlas:
    image: sburn/apache-atlas:2.1.0
    container_name: lambda-atlas
    restart: unless-stopped
    environment:
      - ATLAS_SERVER_HTTP_PORT=21000
      - ATLAS_OPTS=-Xmx2048m -XX:MaxMetaspaceSize=512m
    ports:
      - "${ATLAS_PORT:-21000}:21000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u admin:admin http://localhost:21000/api/atlas/admin/status > /dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - lambda-net
